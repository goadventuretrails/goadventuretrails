<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="author" content="Adventure Trails">
    <link rel="stylesheet" href="assets/styles/main.css">
    <link rel="stylesheet" href="assets/styles/fonts.css">
    <link rel="shortcut icon" href="assets/images/favicon.png" type="image/x-icon">
    <title>Adventure Trails</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
        }

        h1, p {
            margin: 0;
        }

        main {
            display: grid;
            place-items: center;
            min-height: 100vh;
        }

        section {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }

        img {
            width: 100px;
            display: block;
        }

    </style>

</head>
<body>
    <main>
        <section class="hero-simple">
            <img src="assets/images/logo.png" alt="Adventure Trails">
            <h1>Something Wild is Coming</h1>
            <p>Go Adventure Trails is currently under construction. Stay tuned.</p>
        </section>
    </main>
</body>
</html>
